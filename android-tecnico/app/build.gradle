plugins { id 'com.android.application' }
android {
    namespace 'br.com.rovan.campo'
    compileSdk 35
    defaultConfig { applicationId 'br.com.rovan.campo'; minSdk 24; targetSdk 28; versionCode 1; versionName '1.0.0' }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}
dependencies { implementation 'androidx.core:core:1.13.1' }
