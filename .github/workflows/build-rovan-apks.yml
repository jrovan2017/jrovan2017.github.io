name: Build ROVAN Apps APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-orcamentos/**'
      - 'android-tecnico/**'
      - '.github/workflows/build-rovan-apks.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build compatible APK
        run: |
          gradle -p android-orcamentos assembleDebug --no-daemon
          gradle -p android-tecnico assembleDebug --no-daemon
      - name: Publish APK download
        shell: bash
        run: |
          mkdir -p downloads
          cp android-orcamentos/app/build/outputs/apk/debug/app-debug.apk downloads/ROVAN-Orcamentos-MotoG5.apk
          cp android-tecnico/app/build/outputs/apk/debug/app-debug.apk downloads/ROVAN-Tecnico-em-Campo-MotoG5.apk
          git config user.name 'ROVAN Build'
          git config user.email 'jrovan2017@users.noreply.github.com'
          git add downloads/ROVAN-Orcamentos-MotoG5.apk downloads/ROVAN-Tecnico-em-Campo-MotoG5.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publica APKs ROVAN para Moto G5 [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ROVAN-Apps-MotoG5
          path: |
            android-orcamentos/app/build/outputs/apk/debug/app-debug.apk
            android-tecnico/app/build/outputs/apk/debug/app-debug.apk
